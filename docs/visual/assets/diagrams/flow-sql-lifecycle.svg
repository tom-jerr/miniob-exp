    </g>
    <g class="flow-edge" data-from="net" data-to="parser">
      <path d="M 363.0 148.0 L 384.0 148.0 L 384.0 108.0 L 412.0 108.0" fill="none" stroke="#2554C7" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-sql-lifecycle-arrow-blue)" />
