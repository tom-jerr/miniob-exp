<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" role="img" aria-labelledby="flow-sql-lifecycle-title flow-sql-lifecycle-desc" class="toolkit-diagram" data-diagram-id="flow-sql-lifecycle">
  <title id="flow-sql-lifecycle-title">SQL 请求全链路 — 交互式机制流程图</title>
  <desc id="flow-sql-lifecycle-desc">客户端 → 网络 → 解析 → 语义 → 优化 → 执行 → 存储，再原路返回。</desc>
  <defs>
