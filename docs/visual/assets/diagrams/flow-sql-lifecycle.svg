    </g>
    <g class="flow-edge" data-from="parser" data-to="resolver">
      <path d="M 544.0 108.0 L 562.0 108.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-sql-lifecycle-arrow-amber)" />
