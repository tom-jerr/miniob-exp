      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#BE123C" />
    </marker>
    <marker id="flow-bplus-tree-insert-split-arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#64748B" />
