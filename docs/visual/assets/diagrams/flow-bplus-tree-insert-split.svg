<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="flow-bplus-tree-insert-split-title flow-bplus-tree-insert-split-desc" class="toolkit-diagram" data-diagram-id="flow-bplus-tree-insert-split">
