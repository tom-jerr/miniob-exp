<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="flow-cascade-search-title flow-cascade-search-desc" class="toolkit-diagram" data-diagram-id="flow-cascade-search">
  <title id="flow-cascade-search-title">Cascade 优化器搜索 — 交互式机制流程图</title>
  <desc id="flow-cascade-search-desc">任务栈驱动的自顶向下搜索：枚举逻辑/物理表达式，按代价选计划。</desc>
