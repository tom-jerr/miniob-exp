<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="350" viewBox="0 0 1060 350" role="img" aria-labelledby="flow-pax-storage-layout-title flow-pax-storage-layout-desc" class="toolkit-diagram" data-diagram-id="flow-pax-storage-layout">
  <title id="flow-pax-storage-layout-title">PAX 页内存储布局 — 交互式机制流程图</title>
  <desc id="flow-pax-storage-layout-desc">页内垂直分区：页头、位图、列索引与按列读写。</desc>
