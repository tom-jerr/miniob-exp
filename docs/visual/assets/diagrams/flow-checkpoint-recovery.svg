<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="flow-checkpoint-recovery-title flow-checkpoint-recovery-desc" class="toolkit-diagram" data-diagram-id="flow-checkpoint-recovery">
  <title id="flow-checkpoint-recovery-title">检查点与崩溃恢复 — 交互式机制流程图</title>
  <desc id="flow-checkpoint-recovery-desc">冻结式检查点：回填 GC、采样 LSN、刷脏页、fsync、原子元数据与恢复。</desc>
  <defs>
    <marker id="flow-checkpoint-recovery-arrow-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#334155" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#2554C7" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#B45309" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#0F766E" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#6D28D9" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-rose" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#BE123C" />
    </marker>
    <marker id="flow-checkpoint-recovery-arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#64748B" />
    </marker>
  </defs>
  <g class="diag-bg">
    <rect x="0" y="0" width="1060" height="360" rx="12" fill="#FCFDFE" stroke="none" class="diag-canvas-bg" />
  </g>
  <g class="diag-lanes">
    <g class="diag-lane">
      <rect x="16" y="16" width="1028" height="196" rx="10" fill="#F0F5FF" stroke="#2554C7" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#1E40AF" class="diag-lane-title">1. 检查点路径 (Db::sync() Checkpoint Barrier)</text>
      <text x="1030" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">冻结门禁 → GC 回填 → 刷页前采样 LSN → DWB &amp; 数据文件 fsync → 原子替换 sys.db</text>
    </g>
    <g class="diag-lane">
      <rect x="16" y="226" width="1028" height="118" rx="10" fill="#FFF9EB" stroke="#B45309" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="248" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#92400E" class="diag-lane-title">2. WAL 保留策略与崩溃恢复路径 (Db::init() Crash Recovery)</text>
      <text x="1030" y="248" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">保留全部 clog → 恢复 dblwr → 从 checkpoint_lsn 重放 WAL → 回滚未提交事务 → 启动 GC</text>
    </g>
  </g>
  <g class="diag-edges">
    <g class="flow-edge" data-from="gate" data-to="gc">
      <path d="M 176.0 103.0 L 198.0 103.0" fill="none" stroke="#2554C7" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-blue)" />
      <rect x="139.8" y="141.5" width="94.4" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="187.0" y="154.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">持unique lock</text>
    </g>
    <g class="flow-edge" data-from="gc" data-to="lsn">
      <path d="M 342.0 103.0 L 364.0 103.0" fill="none" stroke="#6D28D9" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-purple)" />
      <rect x="319.6" y="45.5" width="66.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="353.0" y="58.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">回填后采样</text>
    </g>
    <g class="flow-edge" data-from="lsn" data-to="flush">
      <path d="M 512.0 103.0 L 534.0 103.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-amber)" />
      <rect x="470.1" y="141.5" width="105.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="523.0" y="154.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">只覆盖target之前</text>
    </g>
    <g class="flow-edge" data-from="flush" data-to="fsync">
      <path d="M 682.0 103.0 L 704.0 103.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-teal)" />
      <rect x="659.6" y="45.5" width="66.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="693.0" y="58.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">持久化屏障</text>
    </g>
    <g class="flow-edge" data-from="fsync" data-to="meta">
      <path d="M 854.0 103.0 L 876.0 103.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-teal)" />
      <rect x="817.6" y="141.5" width="94.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="865.0" y="154.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">原子替换sys.db</text>
    </g>
    <g class="flow-edge" data-from="meta" data-to="wal">
      <path d="M 952.0 138.0 L 952.0 293.0 L 880.0 293.0" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-muted)" stroke-dasharray="5 4" />
      <rect x="951.3" y="202.0" width="73.4" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="988.0" y="215.3" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">第6步未实现</text>
    </g>
    <g class="flow-edge" data-from="meta" data-to="recover">
      <path d="M 912.0 138.0 L 912.0 192.0 L 489.0 192.0 L 489.0 260.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-amber)" />
      <rect x="803.5" y="182.5" width="34.0" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="820.5" y="195.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">重启</text>
    </g>
    <g class="flow-edge" data-from="recover" data-to="gc">
      <path d="M 364.0 293.0 L 270.0 293.0 L 270.0 138.0" fill="none" stroke="#6D28D9" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-checkpoint-recovery-arrow-purple)" />
      <rect x="187.6" y="210.0" width="68.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="222.0" y="223.3" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">启动GC修复</text>
    </g>
  </g>
  <g class="diag-nodes">
    <g class="flow-node role-blue" data-node-id="gate" data-steps="0" tabindex="0" role="button" aria-label="检查点门禁 (unique_lock 门禁)">
      <rect x="32" y="68" width="144" height="70" rx="9" fill="#E6EFFD" stroke="#2554C7" stroke-width="1.8" class="flow-node-rect" />
      <rect x="40" y="74" width="22.0" height="16" rx="4.5" fill="#1E40AF" stroke="none" class="flow-node-badge-bg" />
      <text x="51.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S1</text>
      <text x="104.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">检查点门禁</text>
      <text x="104.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">unique_lock 门禁</text>
    </g>
    <g class="flow-node role-purple" data-node-id="gc" data-steps="1" tabindex="0" role="button" aria-label="GC回填 (MvccGc::collect())">
      <rect x="198" y="68" width="144" height="70" rx="9" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.8" class="flow-node-rect" />
      <rect x="206" y="74" width="22.0" height="16" rx="4.5" fill="#5B21B6" stroke="none" class="flow-node-badge-bg" />
      <text x="217.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S2</text>
      <text x="270.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">GC回填</text>
      <text x="270.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">MvccGc::collect()</text>
    </g>
    <g class="flow-node role-amber" data-node-id="lsn" data-steps="2" tabindex="0" role="button" aria-label="采样LSN (current_lsn() 采样)">
      <rect x="364" y="68" width="148" height="70" rx="9" fill="#FEF0C7" stroke="#B45309" stroke-width="1.8" class="flow-node-rect" />
      <rect x="372" y="74" width="22.0" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="383.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S3</text>
      <text x="438.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">采样LSN</text>
      <text x="438.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">current_lsn() 采样</text>
    </g>
    <g class="flow-node role-blue" data-node-id="flush" data-steps="3" tabindex="0" role="button" aria-label="刷脏页 (Table::sync() 刷页)">
      <rect x="534" y="68" width="148" height="70" rx="9" fill="#E6EFFD" stroke="#2554C7" stroke-width="1.8" class="flow-node-rect" />
      <rect x="542" y="74" width="22.0" height="16" rx="4.5" fill="#1E40AF" stroke="none" class="flow-node-badge-bg" />
      <text x="553.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S4</text>
      <text x="608.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">刷脏页</text>
      <text x="608.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">Table::sync() 刷页</text>
    </g>
    <g class="flow-node role-teal" data-node-id="fsync" data-steps="4" tabindex="0" role="button" aria-label="fsync屏障 (dblwr + data fsync)">
      <rect x="704" y="68" width="150" height="70" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="712" y="74" width="22.0" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="723.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S5</text>
      <text x="779.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">fsync屏障</text>
      <text x="779.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">dblwr + data fsync</text>
    </g>
    <g class="flow-node role-teal" data-node-id="meta" data-steps="5" tabindex="0" role="button" aria-label="更新控制文件 (rename → sys.db)">
      <rect x="876" y="68" width="152" height="70" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="884" y="74" width="22.0" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="895.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S6</text>
      <text x="952.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">更新控制文件</text>
      <text x="952.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">rename → sys.db</text>
    </g>
    <g class="flow-node role-gray" data-node-id="wal" data-steps="6" tabindex="0" role="button" aria-label="WAL截断 (保留全部 clog_*.log)">
      <rect x="704" y="260" width="176" height="66" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.8" class="flow-node-rect" />
      <rect x="712" y="266" width="22.0" height="16" rx="4.5" fill="#334155" stroke="none" class="flow-node-badge-bg" />
      <text x="723.0" y="277.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S7</text>
      <text x="792.0" y="295.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">WAL截断</text>
      <text x="792.0" y="311.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">保留全部 clog_*.log</text>
    </g>
    <g class="flow-node role-amber" data-node-id="recover" data-steps="7" tabindex="0" role="button" aria-label="崩溃恢复 (dblwr 恢复 + WAL 重放)">
      <rect x="364" y="260" width="250" height="66" rx="9" fill="#FEF0C7" stroke="#B45309" stroke-width="1.8" class="flow-node-rect" />
      <rect x="372" y="266" width="22.0" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="383.0" y="277.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S8</text>
      <text x="489.0" y="295.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">崩溃恢复</text>
      <text x="489.0" y="311.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">dblwr 恢复 + WAL 重放</text>
    </g>
  </g>
  <g class="diag-labels" />
</svg>