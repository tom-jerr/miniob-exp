<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="flow-double-write-buffer-flow-title flow-double-write-buffer-flow-desc" class="toolkit-diagram" data-diagram-id="flow-double-write-buffer-flow">
  <title id="flow-double-write-buffer-flow-title">Double Write Buffer 写入与恢复 — 交互式机制流程图</title>
  <desc id="flow-double-write-buffer-flow-desc">脏页先写共享表空间再写数据文件；恢复时校验副本并拷贝。</desc>
  <defs>
    <marker id="flow-double-write-buffer-flow-arrow-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#334155" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#2554C7" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#B45309" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#0F766E" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#6D28D9" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-rose" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#BE123C" />
    </marker>
    <marker id="flow-double-write-buffer-flow-arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#64748B" />
    </marker>
  </defs>
  <g class="diag-bg">
    <rect x="0" y="0" width="1060" height="360" rx="12" fill="#FCFDFE" stroke="none" class="diag-canvas-bg" />
  </g>
  <g class="diag-lanes">
    <g class="diag-lane">
      <rect x="16" y="16" width="1028" height="156" rx="10" fill="#F0F5FF" stroke="#2554C7" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#1E40AF" class="diag-lane-title">1. 运行期脏页刷盘路径 (Normal Flush via Double Write Buffer)</text>
      <text x="1030" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">先写共享表空间 dblwr.db 并 fsync，再写回数据文件</text>
    </g>
    <g class="diag-lane">
      <rect x="16" y="186" width="1028" height="158" rx="10" fill="#FFF9EB" stroke="#B45309" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="208" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#92400E" class="diag-lane-title">2. 崩溃重启恢复路径 (Crash Recovery against Torn Pages)</text>
      <text x="1030" y="208" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">读取 dblwr.db → 校验 Page Checksum → 完好副本还原数据页</text>
    </g>
  </g>
  <g class="diag-edges">
    <g class="flow-edge" data-from="flush_dirty" data-to="add_dwb">
      <path d="M 188.0 103.0 L 254.0 103.0" fill="none" stroke="#2554C7" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-blue)" />
      <rect x="182.1" y="141.5" width="77.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="221.0" y="154.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">不直接写磁盘</text>
    </g>
    <g class="flow-edge" data-from="add_dwb" data-to="write_space">
      <path d="M 412.0 103.0 L 446.0 103.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-amber)" />
    </g>
    <g class="flow-edge" data-from="write_space" data-to="sync_disk">
      <path d="M 612.0 103.0 L 656.0 103.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-teal)" />
      <rect x="617.0" y="141.5" width="34.0" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="634.0" y="154.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">装满</text>
    </g>
    <g class="flow-edge" data-from="sync_disk" data-to="write_datafile">
      <path d="M 824.0 103.0 L 860.0 103.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-teal)" />
    </g>
    <g class="flow-edge" data-from="recover_read" data-to="check_page">
      <path d="M 332.0 275.0 L 396.0 275.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-amber)" />
    </g>
    <g class="flow-edge" data-from="check_page" data-to="copy_page">
      <path d="M 580.0 255.0 L 656.0 241.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-teal)" />
      <rect x="585.5" y="220.5" width="44.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="608.0" y="233.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">未损坏</text>
    </g>
    <g class="flow-edge" data-from="check_page" data-to="ignore_page">
      <path d="M 580.0 295.0 L 656.0 308.0" fill="none" stroke="#BE123C" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-rose)" />
      <rect x="585.5" y="310.0" width="44.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="608.0" y="323.3" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">已损坏</text>
    </g>
    <g class="flow-edge" data-from="copy_page" data-to="write_datafile">
      <path d="M 824.0 241.0 L 942.0 241.0 L 942.0 138.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-double-write-buffer-flow-arrow-teal)" />
      <rect x="897.0" y="225.5" width="55.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="925.0" y="238.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">恢复写回</text>
    </g>
  </g>
  <g class="diag-nodes">
    <g class="flow-node role-blue" data-node-id="flush_dirty" data-steps="0" tabindex="0" role="button" aria-label="刷脏页触发 (BufferPool 刷脏页)">
      <rect x="34" y="68" width="154" height="70" rx="9" fill="#E6EFFD" stroke="#2554C7" stroke-width="1.8" class="flow-node-rect" />
      <rect x="42" y="74" width="22.0" height="16" rx="4.5" fill="#1E40AF" stroke="none" class="flow-node-badge-bg" />
      <text x="53.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S1</text>
      <text x="111.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">刷脏页触发</text>
      <text x="111.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">BufferPool 刷脏页</text>
    </g>
    <g class="flow-node role-blue" data-node-id="add_dwb" data-steps="0,1" tabindex="0" role="button" aria-label="脏页加入 DWB (dblwr.add_page())">
      <rect x="254" y="68" width="158" height="70" rx="9" fill="#E6EFFD" stroke="#2554C7" stroke-width="1.8" class="flow-node-rect" />
      <rect x="262" y="74" width="39.6" height="16" rx="4.5" fill="#1E40AF" stroke="none" class="flow-node-badge-bg" />
      <text x="281.8" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S1,S2</text>
      <text x="333.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">脏页加入 DWB</text>
      <text x="333.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">dblwr.add_page()</text>
    </g>
    <g class="flow-node role-amber" data-node-id="write_space" data-steps="1" tabindex="0" role="button" aria-label="写入共享表空间 (写入 dblwr.db 副本)">
      <rect x="446" y="68" width="166" height="70" rx="9" fill="#FEF0C7" stroke="#B45309" stroke-width="1.8" class="flow-node-rect" />
      <rect x="454" y="74" width="22.0" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="465.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S2</text>
      <text x="529.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">写入共享表空间</text>
      <text x="529.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">写入 dblwr.db 副本</text>
    </g>
    <g class="flow-node role-teal" data-node-id="sync_disk" data-steps="2" tabindex="0" role="button" aria-label="DWB 满时同步磁盘 (fsync(dblwr.db))">
      <rect x="656" y="68" width="168" height="70" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="664" y="74" width="22.0" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="675.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S3</text>
      <text x="740.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">DWB 满时同步磁盘</text>
      <text x="740.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">fsync(dblwr.db)</text>
    </g>
    <g class="flow-node role-teal" data-node-id="write_datafile" data-steps="3" tabindex="0" role="button" aria-label="写入数据文件 (写回 *.data / *.index)">
      <rect x="860" y="68" width="164" height="70" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="868" y="74" width="22.0" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="879.0" y="85.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S4</text>
      <text x="942.0" y="105.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">写入数据文件</text>
      <text x="942.0" y="121.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">写回 *.data / *.index</text>
    </g>
    <g class="flow-node role-amber" data-node-id="recover_read" data-steps="4" tabindex="0" role="button" aria-label="重启读共享表空间 (dblwr.load_pages())">
      <rect x="150" y="240" width="182" height="70" rx="9" fill="#FEF0C7" stroke="#B45309" stroke-width="1.8" class="flow-node-rect" />
      <rect x="158" y="246" width="22.0" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="169.0" y="257.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S5</text>
      <text x="241.0" y="277.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">重启读共享表空间</text>
      <text x="241.0" y="293.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">dblwr.load_pages()</text>
    </g>
    <g class="flow-node role-amber" data-node-id="check_page" data-steps="5,6" tabindex="0" role="button" aria-label="判断页面是否损坏 (校验 Page Checksum)">
      <rect x="396" y="240" width="184" height="70" rx="9" fill="#FEF0C7" stroke="#B45309" stroke-width="1.8" class="flow-node-rect" />
      <rect x="404" y="246" width="39.6" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="423.8" y="257.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S6,S7</text>
      <text x="488.0" y="277.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">判断页面是否损坏</text>
      <text x="488.0" y="293.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">校验 Page Checksum</text>
    </g>
    <g class="flow-node role-teal" data-node-id="copy_page" data-steps="5" tabindex="0" role="button" aria-label="拷贝至数据页 (有效页还原至磁盘)">
      <rect x="656" y="212" width="168" height="58" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="664" y="218" width="22.0" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="675.0" y="229.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S6</text>
      <text x="740.0" y="243.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">拷贝至数据页</text>
      <text x="740.0" y="259.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">有效页还原至磁盘</text>
    </g>
    <g class="flow-node role-rose" data-node-id="ignore_page" data-steps="6" tabindex="0" role="button" aria-label="损坏页面忽略 (丢弃损坏的 DWB 页)">
      <rect x="656" y="282" width="168" height="52" rx="9" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.8" class="flow-node-rect" />
      <rect x="664" y="288" width="22.0" height="16" rx="4.5" fill="#9F1239" stroke="none" class="flow-node-badge-bg" />
      <text x="675.0" y="299.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S7</text>
      <text x="740.0" y="310.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">损坏页面忽略</text>
      <text x="740.0" y="326.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">丢弃损坏的 DWB 页</text>
    </g>
  </g>
  <g class="diag-labels" />
</svg>