<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="flow-lsm-tree-write-compaction-recovery-title flow-lsm-tree-write-compaction-recovery-desc" class="toolkit-diagram" data-diagram-id="flow-lsm-tree-write-compaction-recovery">
  <title id="flow-lsm-tree-write-compaction-recovery-title">LSM-Tree 写入、Compaction 与恢复 — 交互式机制流程图</title>
  <desc id="flow-lsm-tree-write-compaction-recovery-desc">WAL → MemTable → SSTable → Compaction → Manifest 与 WAL 恢复。</desc>
