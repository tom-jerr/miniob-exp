    <marker id="flow-lsm-tree-write-compaction-recovery-arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#B45309" />
    </marker>
    <marker id="flow-lsm-tree-write-compaction-recovery-arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
