  </defs>
  <g class="diag-bg">
    <rect x="0" y="0" width="1060" height="360" rx="12" fill="#FCFDFE" stroke="none" class="diag-canvas-bg" />
  </g>
  <g class="diag-lanes">
    <g class="diag-lane">
      <rect x="16" y="16" width="1028" height="174" rx="10" fill="#F0F5FF" stroke="#2554C7" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#1E40AF" class="diag-lane-title">1. 写入、冻结转储与 Compaction 路径 (Write → Freeze → SSTable → Compaction → Manifest)</text>
      <text x="1030" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">顺序写 WAL → SkipList MemTable → 8KB 冻结转储 → Compaction</text>
    </g>
    <g class="diag-lane">
      <rect x="16" y="204" width="1028" height="140" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="226" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#115E59" class="diag-lane-title">2. 系统启动与恢复路径 (CURRENT → Manifest Snapshot/Compaction → WAL Replay)</text>
      <text x="1030" y="226" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">读取 CURRENT → 恢复 Snapshot 与 Compaction Record → 回放 WAL</text>
    </g>
  </g>
