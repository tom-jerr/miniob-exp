    </g>
    <g class="flow-edge" data-from="otpc" data-to="close">
      <path d="M 730.0 94.0 L 965.0 94.0 L 965.0 134.0" fill="none" stroke="#2554C7" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-thread-model-arrow-blue)" />
      <rect x="814.1" y="70.5" width="66.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
