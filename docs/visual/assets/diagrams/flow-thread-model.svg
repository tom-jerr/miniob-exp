      <text x="416.5" y="83.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">每连接一线程</text>
    </g>
    <g class="flow-edge" data-from="handler" data-to="pool">
      <path d="M 263.0 206.0 L 263.0 249.0 L 378.0 249.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-thread-model-arrow-teal)" />
