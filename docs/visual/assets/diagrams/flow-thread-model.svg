<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" role="img" aria-labelledby="flow-thread-model-title flow-thread-model-desc" class="toolkit-diagram" data-diagram-id="flow-thread-model">
  <title id="flow-thread-model-title">线程模型：连接处理 — 交互式机制流程图</title>
  <desc id="flow-thread-model-desc">主线程收连接后的一连接一线程与线程池两条处理路径。</desc>
  <defs>
    <marker id="flow-thread-model-arrow-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#334155" />
    </marker>
    <marker id="flow-thread-model-arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#2554C7" />
    </marker>
    <marker id="flow-thread-model-arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#B45309" />
    </marker>
    <marker id="flow-thread-model-arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#0F766E" />
    </marker>
    <marker id="flow-thread-model-arrow-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#6D28D9" />
    </marker>
    <marker id="flow-thread-model-arrow-rose" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#BE123C" />
    </marker>
    <marker id="flow-thread-model-arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#64748B" />
    </marker>
  </defs>
  <g class="diag-bg">
    <rect x="0" y="0" width="1060" height="340" rx="12" fill="#FCFDFE" stroke="none" class="diag-canvas-bg" />
  </g>
  <g class="diag-lanes">
    <g class="diag-lane">
      <rect x="16" y="16" width="330" height="308" rx="10" fill="#F4F7FB" stroke="#CBD5E1" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#526077" class="diag-lane-title">1. 连接接入与模型分发</text>
      <text x="332" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">NetServer::serve &amp; ThreadHandler</text>
    </g>
    <g class="diag-lane">
      <rect x="360" y="16" width="512" height="136" rx="10" fill="#F0F5FF" stroke="#2554C7" stroke-width="1.5" class="diag-lane-rect" />
      <text x="374" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#1E40AF" class="diag-lane-title">2A. 一连接一线程模型 (-T=one-thread-per-connection)</text>
      <text x="858" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">OneThreadPerConnectionThreadHandler</text>
    </g>
    <g class="diag-lane">
      <rect x="360" y="166" width="512" height="158" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" class="diag-lane-rect" />
      <text x="374" y="188" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#115E59" class="diag-lane-title">2B. 线程池模型 (-T=java-thread-pool)</text>
