    </g>
    <g class="flow-edge" data-from="find_frame" data-to="load_frame">
      <path d="M 428.0 152.0 L 642.0 152.0" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-buffer-pool-page-lifecycle-arrow-teal)" />
      <rect x="501.6" y="126.5" width="66.9" height="19.0" rx="5.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" class="flow-edge-pill" />
      <text x="535.0" y="139.8" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="11.2" font-weight="600" text-anchor="middle" fill="#526077" class="flow-edge-label">有空闲页帧</text>
    </g>
