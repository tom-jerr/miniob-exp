      <rect x="262" y="132" width="166" height="76" rx="9" fill="#E6EFFD" stroke="#2554C7" stroke-width="1.8" class="flow-node-rect" />
      <rect x="270" y="138" width="57.3" height="16" rx="4.5" fill="#1E40AF" stroke="none" class="flow-node-badge-bg" />
      <text x="298.7" y="149.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S2,S3,S6</text>
      <text x="345.0" y="172.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">查找空闲页帧</text>
      <text x="345.0" y="188.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">BPFrameManager</text>
    </g>
    <g class="flow-node role-teal" data-node-id="load_frame" data-steps="3,6" tabindex="0" role="button" aria-label="页帧关联并载入 (Frame 绑定并读入页)">
      <rect x="642" y="132" width="168" height="76" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8" class="flow-node-rect" />
      <rect x="650" y="138" width="39.6" height="16" rx="4.5" fill="#115E59" stroke="none" class="flow-node-badge-bg" />
      <text x="669.8" y="149.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S4,S7</text>
      <text x="726.0" y="172.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">页帧关联并载入</text>
      <text x="726.0" y="188.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">Frame 绑定并读入页</text>
    </g>
    <g class="flow-node role-amber" data-node-id="evict_page" data-steps="5,6" tabindex="0" role="button" aria-label="淘汰现有页面 (按策略淘汰旧 Frame)">
