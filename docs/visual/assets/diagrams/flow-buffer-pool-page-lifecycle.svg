<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" role="img" aria-labelledby="flow-buffer-pool-page-lifecycle-title flow-buffer-pool-page-lifecycle-desc" class="toolkit-diagram" data-diagram-id="flow-buffer-pool-page-lifecycle">
  <title id="flow-buffer-pool-page-lifecycle-title">Buffer Pool 页生命周期 — 交互式机制流程图</title>
  <desc id="flow-buffer-pool-page-lifecycle-desc">页帧分配、载入、业务使用与空间不足时的腾退复用。</desc>
  <defs>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#334155" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#2554C7" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#B45309" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-teal" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#0F766E" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#6D28D9" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-rose" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#BE123C" />
    </marker>
    <marker id="flow-buffer-pool-page-lifecycle-arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#64748B" />
    </marker>
  </defs>
  <g class="diag-bg">
    <rect x="0" y="0" width="1060" height="340" rx="12" fill="#FCFDFE" stroke="none" class="diag-canvas-bg" />
  </g>
  <g class="diag-lanes">
    <g class="diag-lane">
      <rect x="16" y="16" width="210" height="308" rx="10" fill="#F4F7FB" stroke="#CBD5E1" stroke-width="1.5" class="diag-lane-rect" />
      <text x="30" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#526077" class="diag-lane-title">1. 磁盘文件层</text>
      <text x="212" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">Page 0 Header &amp; Data Pages</text>
    </g>
    <g class="diag-lane">
      <rect x="240" y="16" width="588" height="308" rx="10" fill="#F0F5FF" stroke="#2554C7" stroke-width="1.5" class="diag-lane-rect" />
      <text x="254" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#1E40AF" class="diag-lane-title">2. 缓冲池管理层 (DiskBufferPool &amp; BPFrameManager)</text>
      <text x="814" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">页帧查找、空闲直接载入 vs 内存满时淘汰重绑</text>
    </g>
    <g class="diag-lane">
      <rect x="842" y="16" width="202" height="308" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" class="diag-lane-rect" />
      <text x="856" y="38" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#115E59" class="diag-lane-title">3. 上层业务模块</text>
      <text x="1030" y="38" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11.2" font-weight="500" text-anchor="end" fill="#7B89A1" class="diag-lane-sub">RecordManager / B+Tree</text>
    </g>
  </g>
  <g class="diag-edges">
    <g class="flow-edge" data-from="read_page" data-to="find_frame">
