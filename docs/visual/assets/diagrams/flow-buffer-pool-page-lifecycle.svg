    </g>
    <g class="flow-edge" data-from="rebind_frame" data-to="load_frame">
      <path d="M 726.0 232.0 L 726.0 208.0" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" class="flow-edge-path" marker-end="url(#flow-buffer-pool-page-lifecycle-arrow-amber)" />
    </g>
    <g class="flow-edge" data-from="load_frame" data-to="use_page">
