      <rect x="458" y="230" width="39.6" height="16" rx="4.5" fill="#92400E" stroke="none" class="flow-node-badge-bg" />
      <text x="477.8" y="241.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="10.2" font-weight="700" text-anchor="middle" fill="#FFFFFF" class="flow-node-badge-text">S6,S7</text>
      <text x="530.0" y="262.0" font-family="&quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14.2" font-weight="700" text-anchor="middle" fill="#141E30" class="flow-node-title">淘汰现有页面</text>
      <text x="530.0" y="278.5" font-family="&quot;JetBrains Mono&quot;, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#526077" class="flow-node-sub">按策略淘汰旧 Frame</text>
    </g>
    <g class="flow-node role-amber" data-node-id="rebind_frame" data-steps="6" tabindex="0" role="button" aria-label="页帧重新关联 (复用被淘汰 Frame)">
