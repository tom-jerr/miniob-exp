name: build

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake build-essential libssl-dev

      - name: Cache third-party dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/3rd/usr
          key: deps-3rd-${{ runner.os }}-${{ hashFiles('build.sh', '.gitmodules') }}

      - name: Init third-party dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: sudo bash build.sh init

      - name: Build Debug with Concurrency
        shell: bash
        run: bash build.sh debug -DCONCURRENCY=ON --make -j$(nproc)

      - name: Run Unit Tests (CTest)
        shell: bash
        run: |
          cd build_debug
          ctest -E memtracer_test --output-on-failure

      - name: Build Release
        shell: bash
        run: bash build.sh release -DCONCURRENCY=ON -DWITH_UNIT_TESTS=OFF --make -j$(nproc)
